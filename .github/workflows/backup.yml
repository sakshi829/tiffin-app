name: nightly-backup

# Supabase's free plan has NO automatic backups. This job takes a nightly
# data-only dump (schema lives in supabase/migrations), ENCRYPTS it with `age`
# using a PUBLIC key, and keeps it as a private workflow artifact for 90 days.
# The private key never touches GitHub: keep it offline (see docs/SETUP_PERSONAL_LAPTOP.md).
# Live login sessions, refresh tokens and one-time codes are NOT backed up (after a
# restore everyone simply signs in again). Accounts and authenticator setups are.
# GitHub emails you automatically if this scheduled job fails.

on:
  schedule:
    - cron: '30 20 * * *'      # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client and age
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common age
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump and encrypt
        env:
          # Use the Supabase *Session pooler* connection string (IPv4); GitHub runners have no IPv6.
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "SUPABASE_DB_URL secret missing"; exit 1; }
          test -n "$AGE_RECIPIENT" || { echo "BACKUP_AGE_PUBLIC_KEY secret missing"; exit 1; }
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir -p out
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --data-only --format=custom --no-owner --no-privileges \
            --schema=public --schema=app --schema=auth --schema=storage \
            --exclude-table-data='auth.sessions' --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.mfa_challenges' --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.one_time_tokens' --exclude-table-data='auth.audit_log_entries' \
            | age -r "$AGE_RECIPIENT" -o "out/amruta-${stamp}.dump.age"
          test -s "out/amruta-${stamp}.dump.age"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_id }}
          path: out/*.age
          retention-days: 90
          if-no-files-found: error
