name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact commits (a tag like @v4 can be silently re-pointed).
      # Dependabot proposes updates, after a 7-day cooldown (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # later steps never need the repository token
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (all apps + shared)
        run: npm run typecheck
      - name: Unit + database security tests (blocks merge on any failure)
        run: npm test
      - name: Dependency vulnerabilities (high and above)
        run: npm audit --audit-level=high --omit=dev

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks itself (same version as the pre-commit hook), checksum-verified. It scans the
      # WHOLE history on every run. (gitleaks-action scanned only the pushed range, and crashed on
      # a repository's first push because the first commit has no parent.)
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all commits for secrets (fails on any finding)
        run: /tmp/gitleaks git --redact --no-banner -v .

  static-analysis:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/default --config p/typescript --config p/secrets --metrics=off --error
